<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 292" width="900" height="292" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">Hand-offs answered by build</title><desc id="d">Cascade 48%, duplex run 1 4%, duplex run 2 10%; people 66% on the same scorer.</desc><text x="24.0" y="34.0" font-size="18" font-weight="600" fill="#f0f6fc" text-anchor="start">The duplex model answers about 1 in 10 hand-offs; people answer 2 in 3</text><text x="24.0" y="58.0" font-size="13.5" font-weight="400" fill="#9198a1" text-anchor="start">Turn hand-offs answered, scored from each system's sound on real two-person recordings</text><line x1="220.0" y1="92" x2="220.0" y2="228" stroke="#30363d" stroke-width="1"/><text x="220.0" y="246.0" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">0%</text><line x1="380.0" y1="92" x2="380.0" y2="228" stroke="#30363d" stroke-width="1"/><text x="380.0" y="246.0" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">25%</text><line x1="540.0" y1="92" x2="540.0" y2="228" stroke="#30363d" stroke-width="1"/><text x="540.0" y="246.0" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">50%</text><line x1="700.0" y1="92" x2="700.0" y2="228" stroke="#30363d" stroke-width="1"/><text x="700.0" y="246.0" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">75%</text><line x1="860.0" y1="92" x2="860.0" y2="228" stroke="#30363d" stroke-width="1"/><text x="860.0" y="246.0" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">100%</text><text x="206.0" y="120.0" font-size="14" font-weight="400" fill="#f0f6fc" text-anchor="end">Cascade (first build)</text><path d="M220.0 104.0H523.2A4 4 0 0 1 527.2 108.0V122.0A4 4 0 0 1 523.2 126.0H220.0Z" fill="#898781"/><text x="535.2" y="120.0" font-size="14" font-weight="600" fill="#f0f6fc" text-anchor="start">48%</text><text x="206.0" y="164.0" font-size="14" font-weight="400" fill="#f0f6fc" text-anchor="end">Duplex, run 1</text><path d="M220.0 148.0H241.6A4 4 0 0 1 245.6 152.0V166.0A4 4 0 0 1 241.6 170.0H220.0Z" fill="#898781"/><text x="253.6" y="164.0" font-size="14" font-weight="600" fill="#f0f6fc" text-anchor="start">4%</text><text x="206.0" y="208.0" font-size="14" font-weight="400" fill="#f0f6fc" text-anchor="end">Duplex, run 2</text><path d="M220.0 192.0H281.9A4 4 0 0 1 285.9 196.0V210.0A4 4 0 0 1 281.9 214.0H220.0Z" fill="#3987e5"/><text x="293.9" y="208.0" font-size="14" font-weight="600" fill="#f0f6fc" text-anchor="start">10%</text><line x1="642.4" y1="86" x2="642.4" y2="228" stroke="#9198a1" stroke-width="1.5"/><text x="648.4" y="82.0" font-size="13" font-weight="600" fill="#9198a1" text-anchor="start">People, same scorer: 66%</text><text x="24.0" y="278.0" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="start">Cascade and run 1: frozen test set, 15 real tracks (56 min). Run 2: 8 validation conversations (28 min), listen setting 0. Data: results/.</text></svg>
